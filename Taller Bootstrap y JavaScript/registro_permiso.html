<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Permisos</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <header class="bg-primary text-white p-4 text-center shadow-sm mb-4">
        <h1 class="h3">Lección: Manipulación del DOM y Bootstrap</h1>
        <h2 class="h5">Estudiante: Ormaza Padilla Kenny Alexander</h2>
        <h3 class="h6">Materia: Desarrollo de aplicaciones web</h3>
    </header>

    <div class="container my-4">
        <div class="card shadow-sm mx-auto col-lg-10">
            <div class="card-header bg-white">
                <h4 class="mb-0 text-primary">Registrar Solicitud</h4>
            </div>
            <div class="card-body">
                
                <form id="formulario">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="cedula" class="form-label">Cédula:</label>
                            <input type="text" id="cedula" class="form-control" required placeholder="Ej: 0999999999">
                        </div>
                        <div class="col-md-4">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <input type="text" id="nombre" class="form-control" required placeholder="Ej: Juan">
                        </div>
                        <div class="col-md-4">
                            <label for="apellido" class="form-label">Apellido:</label>
                            <input type="text" id="apellido" class="form-control" required placeholder="Ej: Pérez">
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="fechaInicio" class="form-label">Fecha inicio:</label>
                            <input type="date" id="fechaInicio" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="fechaFin" class="form-label">Fecha fin:</label>
                            <input type="date" id="fechaFin" class="form-control" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-4">
                        <button type="submit" class="btn btn-primary px-4">Agregar Solicitud</button>
                        <h5 class="mb-0 text-muted">
                            Total de registros: <span id="contador" class="badge bg-secondary">0</span>
                        </h5>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Cédula</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Fecha Inicio</th>
                                <th>Fecha Fin</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla">
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
