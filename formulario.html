<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body style="text-align:center;">

    <header>
        <h1>Formulario</h1>
        <p>Este es el formulario con los inputs usados.</p>
        <nav>
            <ul style="display:inline-block; text-align:left;">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="formulario.html">Formulario</a></li>
                <li><a href="informacion.html">Información inputs</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form action="" method="post" style="display:inline-block; text-align:left;">
            
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Escriba su nombre"><br><br>

            <label for="telefono">Número celular:</label>
            <input type="number" id="telefono" name="telefono" required placeholder="Escriba su número"><br><br>

            <label for="cedula">Cédula:</label>
            <input type="file" id="cedula" name="cedula"><br><br>

            <label>Estado civil:</label><br>

            <input type="radio" id="soltero" name="estado" value="soltero">
            <label for="soltero">Soltero</label><br>

            <input type="radio" id="casado" name="estado" value="casado">
            <label for="casado">Casado</label><br>

            <input type="radio" id="viudo" name="estado" value="viudo">
            <label for="viudo">Viudo</label><br><br>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required placeholder="ejemplo@gmail.com"><br><br>
            
            <label for="contraseña">Contraseña:</label>
            <input type="password" id="contraseña" name="contraseña" required placeholder="Escriba su contraseña"><br><br>

            <label for="fecha">Fecha:</label>
            <input type="date"id="fecha" name="fecha"><br><br>

            <label for="color">Color favorito:</label>
            <input type="color" id="color" name="color"><br><br>

            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="5" cols="30" required placeholder="Escriba su mensaje"></textarea><br><br>

            <label for="satisfaccion">Nivel de satisfacción del formulario:</label>
            <input type="range" id="satisfaccion" name="satisfaccion"><br><br>

            <input type="checkbox" id="terminos" name="terminos" required>
            <label for="terminos">Acepto los términos y condiciones</label><br><br>

            <button type="submit">Enviar formulario</button>       
            <button type="reset">Limpiar formulario</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
